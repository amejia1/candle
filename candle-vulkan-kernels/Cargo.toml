[package]
name = "candle-vulkan-kernels"
version = "0.11.1"
edition = "2021"
build = "build.rs"

description = "Vulkan compute kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
thiserror = "2"
bytemuck = "1"
half = "2.5.0"
vulkano = { path = "../vendor/vulkano/vulkano" }
parking_lot = "0.12"

[build-dependencies]
shader-slang-dev = { git = "https://github.com/amejia1/shader-slang-dev", ref = "276ced852f38979d77e9423b4ce89e83010a3034" }
spirv = "0.3"

[profile.profiling]
inherits = "release"
debug = 2
